site_name: Wenwu Docs
site_description: Личная база знаний по программированию, колледжу, сетям и проектам

theme:
  name: material
  language: ru

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Тёмная тема

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist
  - tables
nav:
  - Главная: index.md

  - Программирование:
      - programming/index.md
      - Python:
          - programming/python/index.md
          - Алгоритмы: programming/python/algorithms/
          - Функции: programming/python/functions/
      - C++:
          - programming/cpp/index.md
          - Алгоритмы: programming/cpp/algorithms/
      - JavaScript:
          - programming/javascript/

  - Колледж:
      - college/index.md
      - 2 курс: college/2-course/
      - 3 курс: college/3-course/

  - Сети:
      - networking/index.md
      - OpenWrt: networking/openwrt/
      - VPN: networking/vpn/
      - DNS: networking/dns/
      - Диагностика: networking/troubleshooting/

  - Проекты:
      - projects/index.md

  - Справочник:
      - references/index.md
      - Программы: references/software.md
      - Прошивки: references/firmware.md