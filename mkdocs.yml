site_name: Wenwu Docs
site_description: Личная база знаний по программированию, колледжу, сетям и проектам

repo_url: https://github.com/Wenwu-PA/wenwu-docs
repo_name: Wenwu-PA/wenwu-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: ru

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Тёмная тема

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist
  - tables
nav:
  - Главная: index.md

  - 🎓 IT TOP:
      - it-top/index.md

      - 2025:
          - it-top/2025/index.md
          - Домашние работы: it-top/2025/homework/index.md
          - Классные работы: it-top/2025/classwork/index.md

      - 2026:
          - it-top/2026/index.md
          - Домашние работы: it-top/2026/homework/index.md
          - Классные работы: it-top/2026/classwork/index.md

  - 💻 Программирование:
      - programming/index.md

      - Python:
          - programming/python/index.md
          - Алгоритмы: programming/python/algorithms/index.md
          - Функции: programming/python/functions/index.md

      - C++:
          - programming/cpp/index.md
          - Алгоритмы: programming/cpp/algorithms/index.md
          - OOP: programming/cpp/oop/index.md

      - JavaScript:
          - programming/javascript/index.md

  - 🌐 Сети:
      - networking/index.md
      - OpenWrt: networking/openwrt/index.md
      - VPN: networking/vpn/index.md
      - DNS: networking/dns/index.md
      - Маршрутизация: networking/routing/index.md
      - Диагностика: networking/troubleshooting/index.md

  - 🛠 Проекты:
      - projects/index.md

  - 📚 Справочник:
      - references/index.md
      - Программы: references/software.md
      - Прошивки: references/firmware.md